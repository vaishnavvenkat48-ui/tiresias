<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d9d1bf" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint (no dark→light flash).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('tiresias_prefs') || '{}');
          var t = p.scheme === 2 ? (p.theme || 'light') : 'light';
          if (t === 'system') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
    <title>Tiresias — Discover Knowledge Beyond Search</title>
    <meta name="description" content="Tiresias turns any topic into an interactive, physics-driven knowledge graph you can explore, expand, save and learn from." />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a2a26'/><circle cx='16' cy='16' r='4' fill='%23a8c08c'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23d4b26a' stroke-width='1.5'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
